[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_VERSION = "20"

# Bare parent slugs (/shop/retatrutide, /shop/ghk-cu, etc.) are now the
# canonical product URLs — no per-variant redirects needed.
