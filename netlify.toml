[build]
  command = "npm run build"
  publish = ".next"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[build.environment]
  NEXT_TELEMETRY_DISABLED = "1"
  NODE_VERSION = "20"

# Bare parent slugs (/shop/retatrutide, /shop/ghk-cu, etc.) are now the
# canonical product URLs — no per-variant redirects needed.

[[redirects]]
  from = "https://greenstonewellness.store/*"
  to = "https://gswellnesspharmacy.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.greenstonewellness.store/*"
  to = "https://gswellnesspharmacy.com/:splat"
  status = 301
  force = true

[[redirects]]
  from = "https://www.gswellnesspharmacy.com/*"
  to = "https://gswellnesspharmacy.com/:splat"
  status = 301
  force = true
