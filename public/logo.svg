<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 688 384" role="img" aria-label="Greenstone Wellness">
  <title>Greenstone Wellness</title>
  <!-- Brand mark: circle with cross + leaf -->
  <g transform="translate(344 96)">
    <circle cx="0" cy="0" r="60" fill="none" stroke="#1F4D3F" stroke-width="6"/>
    <!-- Cross (lighter sage) -->
    <g fill="#A4C7AC">
      <rect x="-7" y="-34" width="14" height="68" rx="2"/>
      <rect x="-28" y="-7" width="56" height="14" rx="2"/>
    </g>
    <!-- Leaf (sage), overlapping the cross horizontal arm -->
    <path d="M 4 -2 C 22 -22 44 -22 56 -10 C 44 6 22 14 4 -2 Z" fill="#7AA98A"/>
    <path d="M 8 -4 C 24 -18 42 -18 52 -10" fill="none" stroke="#1F4D3F" stroke-width="1.5" stroke-linecap="round"/>
  </g>
  <!-- Wordmark: GREENSTONE -->
  <text x="344" y="248"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-weight="700"
        font-size="72"
        letter-spacing="4"
        fill="#1F4D3F">GREENSTONE</text>
  <!-- Subtitle: WELLNESS -->
  <text x="344" y="304"
        text-anchor="middle"
        font-family="Georgia, 'Times New Roman', serif"
        font-weight="400"
        font-size="32"
        letter-spacing="14"
        fill="#7AA98A">WELLNESS</text>
</svg>
